services:

  mail:
    image: axllent/mailpit
    ports:
      - "1025:1025"   # SMTP — where your app sends
      - "8025:8025"   # web page — where you read

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommercepass
    ports:
      # 5433 on the host so this never collides with a Postgres you already run.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Inside the compose network the database is reachable as "db" on 5432,
      # not on the 5433 the host sees.
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ecommerce
      DB_USER: ecommerce
      DB_PASSWORD: ecommercepass
      MAIL_HOST: mail
      MAIL_PORT: 1025
      # Prefix for the activation links in the emails. Must be the URL a browser
      # can actually reach — not the container hostname.
      APP_BASE_URL: http://localhost:8080
      JWT_SECRET: 225ccbee3e52601a554e999b650f4c70fe0a39026dd126ecf73d1754ad80b9be
    depends_on:
      db:
        condition: service_healthy
      # Without this the app can start before SMTP is listening, and the first
      # registrations lose their activation mail — nothing retries.
      mail:
        condition: service_started

volumes:
  postgres_data:
