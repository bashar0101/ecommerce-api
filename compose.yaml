services:

  mail:
    image: axllent/mailpit
    ports:
      - "1025:1025"   # SMTP — where your app sends
      - "8025:8025"   # web page — where you read
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: ecommercepass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      MAIL_HOST: mail
      MAIL_PORT: 1025
      # Prefix for the activation links in the emails. Must be the URL a browser
      # can actually reach — not the container hostname.
      APP_BASE_URL: http://localhost:8080
      SPRING_DATASOURCE_URL: "jdbc:mysql://db:3306/ecommerce?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USER: ecommerce
      DB_PASSWORD: ecommercepass
      JWT_SECRET: 225ccbee3e52601a554e999b650f4c70fe0a39026dd126ecf73d1754ad80b9be
    depends_on:
      db:
        condition: service_healthy
      # Without this the app can start before SMTP is listening, and the first
      # registrations lose their activation mail — nothing retries.
      mail:
        condition: service_started

volumes:
  mysql_data: