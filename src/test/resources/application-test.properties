# NON_KEYWORDS=USER: "USER" is a reserved word in H2 2.x, so `create table user`
# is a syntax error. MySQL allows it, which is why this only breaks under test.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop