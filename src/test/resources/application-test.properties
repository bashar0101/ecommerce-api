# MODE=PostgreSQL makes H2 imitate the dialect the app actually runs on.
# NON_KEYWORDS=USER: "USER" is reserved in H2 2.x. Redundant now that the entity
# maps to @Table("users"), kept as a guard.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

jwt.secret=test_secret_key_at_least_32_characters_long_1234
jwt.expiration-ms=3600000