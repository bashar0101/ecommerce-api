spring.application.name=ecommerce

# Load secrets from .env in the project root (gitignored).
# "optional:" means the app still starts if the file is missing —
# in production the same keys come from real environment variables instead.
spring.config.import=optional:file:.env[.properties]

# ── Server ──────────────────────────────
server.port=8080
# all URLs start with /api
# server.servlet.context-path=/api/v1


# Database connection
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}


# ── JPA ─────────────────────────────────
spring.jpa.hibernate.ddl-auto=update 
# Show SQL queries in the console
spring.jpa.show-sql=true


# ── Test data seeding ───────────────────
# Inserts the user below on startup if it does not already exist.
app.seed.enabled=true
app.seed.user.id=11111111-1111-1111-1111-111111111111
app.seed.user.email=test@example.com
app.seed.user.password=password123


# ── Logging ─────────────────────────────
logging.level.root=INFO
# more detail for your own code
logging.level.com.apps.ecommerce=DEBUG

# if we want to use a different profile, we can uncomment the following line and set the desired profile
# spring.profiles.active=dev 
