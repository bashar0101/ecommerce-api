spring.application.name=ecommerce

# Load secrets from .env in the project root (gitignored).
# "optional:" means the app still starts if the file is missing —
# on Render the same keys come from real environment variables instead.
spring.config.import=optional:file:.env[.properties]

# ── Server ──────────────────────────────
# Render injects PORT and expects the process to bind it. 8080 locally.
server.port=${PORT:8080}


# ── Database (PostgreSQL) ───────────────
# Built from parts rather than one URL so the same line works locally and on
# Render, where the host/port/name come from the managed database.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}


# ── JPA ─────────────────────────────────
# "update" — never create-drop here. The deployed database is persistent, and
# create-drop would wipe every user, product and order on each restart.
# The test profile uses create-drop, which is correct there: H2 is throwaway.
spring.jpa.hibernate.ddl-auto=update
# Noisy in production; handy while learning.
spring.jpa.show-sql=${SHOW_SQL:true}


# ── Logging ─────────────────────────────
logging.level.root=INFO
logging.level.com.apps.ecommerce=${APP_LOG_LEVEL:DEBUG}


# ── Auth ────────────────────────────────
# Must be at least 32 bytes or Keys.hmacShaKeyFor refuses and the app won't start.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# ── Mail ────────────────────────────────
# Which MailService implementation is active.
#   smtp   - default. Mailpit locally; will NOT work on Render, whose instances
#            cannot open outbound connections on 25/465/587.
#   resend - HTTPS call to api.resend.com. Needs RESEND_API_KEY.
app.mail.provider=${MAIL_PROVIDER:smtp}
resend.api-key=${RESEND_API_KEY:}

# Defaults target the Mailpit container in compose.yaml. A real provider needs
# credentials and TLS, which is what the MAIL_* variables switch on.
# For Gmail: host smtp.gmail.com, port 587, auth and starttls true, and an
# app password (2FA required) — a normal account password is always rejected.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
# 5s was fine against a Mailpit container on localhost. A TLS handshake plus
# AUTH to a real relay, from a cold free-tier instance, regularly exceeds it —
# and a timeout here looks exactly like "no email arrived".
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_TIMEOUT_MS:15000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:15000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_TIMEOUT_MS:15000}

# The From header, used by both providers. Nobody lets you claim an address you
# do not own: Gmail wants the authenticated account (hence the username
# fallback), and Resend wants onboarding@resend.dev or an address on a domain
# you have verified.
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:noreply@ecommerce.local}}

# Prefix for activation links. Must be the URL a browser can actually reach —
# on Render that is https://<your-service>.onrender.com
app.base-url=${APP_BASE_URL:http://localhost:8080}

# Browser origins allowed to call this API. Comma separated. The browser blocks
# any origin not listed, so the deployed front end must be added here (on Render
# set CORS_ALLOWED_ORIGINS) or every request from it fails with a CORS error.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}


management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never


spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Lettuce defaults to a 10s connect timeout. The rate limiter fails open when
# Redis is missing, but without these every login would still sit there waiting
# for that timeout first — a dead limiter would feel like a dead login endpoint.
# Redis is local to the deployment; half a second is already generous.
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:500ms}
spring.data.redis.timeout=${REDIS_TIMEOUT:500ms}
