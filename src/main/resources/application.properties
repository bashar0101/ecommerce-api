spring.application.name=ecommerce

# Load secrets from .env in the project root (gitignored).
# "optional:" means the app still starts if the file is missing —
# on Render the same keys come from real environment variables instead.
spring.config.import=optional:file:.env[.properties]

# ── Server ──────────────────────────────
# Render injects PORT and expects the process to bind it. 8080 locally.
server.port=${PORT:8080}


# ── Database (PostgreSQL) ───────────────
# Built from parts rather than one URL so the same line works locally and on
# Render, where the host/port/name come from the managed database.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecommerce}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}


# ── JPA ─────────────────────────────────
# "update" — never create-drop here. The deployed database is persistent, and
# create-drop would wipe every user, product and order on each restart.
# The test profile uses create-drop, which is correct there: H2 is throwaway.
spring.jpa.hibernate.ddl-auto=update
# Noisy in production; handy while learning.
spring.jpa.show-sql=${SHOW_SQL:true}


# ── Logging ─────────────────────────────
logging.level.root=INFO
logging.level.com.apps.ecommerce=${APP_LOG_LEVEL:DEBUG}


# ── Auth ────────────────────────────────
# Must be at least 32 bytes or Keys.hmacShaKeyFor refuses and the app won't start.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}


# ── Mail ────────────────────────────────
# Defaults target the Mailpit container in compose.yaml. A real provider needs
# credentials and TLS, which is what the MAIL_* variables switch on.
# For Gmail: host smtp.gmail.com, port 587, auth and starttls true, and an
# app password (2FA required) — a normal account password is always rejected.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
# 5s was fine against a Mailpit container on localhost. A TLS handshake plus
# AUTH to a real relay, from a cold free-tier instance, regularly exceeds it —
# and a timeout here looks exactly like "no email arrived".
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_TIMEOUT_MS:15000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:15000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_TIMEOUT_MS:15000}

# Falls back to the SMTP username, because Gmail refuses to relay a From that is
# not the authenticated account or one of its verified aliases. Leaving this as
# a made-up address is a 553 "Mail relay denied", not a delivered email.
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:noreply@ecommerce.local}}

# Prefix for activation links. Must be the URL a browser can actually reach —
# on Render that is https://<your-service>.onrender.com
app.base-url=${APP_BASE_URL:http://localhost:8080}


management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never